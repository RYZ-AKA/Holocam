<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced AR Viewfinder Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Fullscreen Viewfinder Camera Background */
        #webcam {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); 
            z-index: 1;
        }

        /* Transparent 3D Overlay Layer */
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        /* UI Overlay Layer */
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* Top Left Status Badge */
        #status-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Center Camera Viewfinder Ring */
        #center-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        /* Sleek Movable Control Panel */
        #control-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 170px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* Drag Handle Header */
        .panel-header {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: grab;
        }
        
        .panel-header:active {
            cursor: grabbing;
        }

        .shape-btn {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
        }

        .shape-btn:hover {
            background-color: rgba(0, 245, 212, 0.2);
            border-color: #00f5d4;
            color: #00f5d4;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="status-badge">System Initializing...</div>
        
        <div id="center-reticle"></div>

        <div id="control-panel">
            <div class="panel-header" id="panel-drag-handle">:: SHAPE MATRIX</div>
            <button class="shape-btn" onclick="switchGeometry('cube')">Box Mesh</button>
            <button class="shape-btn" onclick="switchGeometry('sphere')">Sphere Mesh</button>
            <button class="shape-btn" onclick="switchGeometry('torus')">Torus Ring</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, activeMesh;
        let currentShapeType = 'cube';
        const videoElement = document.getElementById('webcam');
        const statusBadge = document.getElementById('status-badge');

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0); 
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            switchGeometry('cube');

            window.addEventListener('resize', onWindowResize);
            setupPanelDragging();
        }

        function switchGeometry(type) {
            currentShapeType = type;
            if (activeMesh) scene.remove(activeMesh);

            let geometry;
            if (type === 'cube') {
                geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            } else if (type === 'sphere') {
                geometry = new THREE.SphereGeometry(0.8, 16, 16);
            } else if (type === 'torus') {
                geometry = new THREE.TorusGeometry(0.6, 0.2, 8, 24);
            }

            const material = new THREE.MeshBasicMaterial({
                color: 0x00f5d4, 
                wireframe: true,
                transparent: true,
                opacity: 0.9
            });

            activeMesh = new THREE.Mesh(geometry, material);
            scene.add(activeMesh);
        }

        // Mathematical conversion from MediaPipe coordinate space to full screen 3D vector space
        function calculateWorldPos(normalizedX, normalizedY) {
            const ndcX = (1 - normalizedX) * 2 - 1;
            const ndcY = -(normalizedY * 2 - 1);

            const targetVector = new THREE.Vector3(ndcX, ndcY, 0.5);
            targetVector.unproject(camera);
            const direction = targetVector.sub(camera.position).normalize();
            const distance = -camera.position.z / direction.z;
            return camera.position.clone().add(direction.multiplyScalar(distance));
        }

        function initTracking() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                const trackedHands = results.multiHandLandmarks || [];

                if (trackedHands.length > 0) {
                    controls.enabled = false; // Disable OrbitControls during hand manipulation

                    if (trackedHands.length === 1) {
                        statusBadge.innerText = "1 Hand: Position & 3D Rotation Locked";
                        
                        const hand = trackedHands[0];
                        
                        // Center Anchor Tracking Point Calculation
                        const centerX = (hand[0].x + hand[5].x + hand[17].x) / 3;
                        const centerY = (hand[0].y + hand[5].y + hand[17].y) / 3;
                        const worldPos = calculateWorldPos(centerX, centerY);
                        activeMesh.position.lerp(worldPos, 0.25);

                        // Complete 3D Orientation Mapping Rules
                        const rollAngle = Math.atan2(hand[17].y - hand[5].y, hand[17].x - hand[5].x);
                        const yawAngle = (hand[9].x - hand[0].x) * 2.5;
                        const pitchAngle = (hand[9].y - hand[0].y) * 2.5;

                        activeMesh.rotation.z = THREE.MathUtils.lerp(activeMesh.rotation.z, rollAngle, 0.15);
                        activeMesh.rotation.y = THREE.MathUtils.lerp(activeMesh.rotation.y, yawAngle, 0.15);
                        activeMesh.rotation.x = THREE.MathUtils.lerp(activeMesh.rotation.x, pitchAngle, 0.15);

                    } else if (trackedHands.length === 2) {
                        statusBadge.innerText = "2 Hands: Resizing Width / Height / Length";

                        const hand1 = trackedHands[0];
                        const hand2 = trackedHands[1];

                        // Midpoint tracking for placement stability between both points
                        const midX = (hand1[9].x + hand2[9].x) / 2;
                        const midY = (hand1[9].y + hand2[9].y) / 2;
                        const targetMidpoint = calculateWorldPos(midX, midY);
                        activeMesh.position.lerp(targetMidpoint, 0.25);

                        // Individual dimensional difference tracking calculation vectors
                        const deltaWidth = Math.abs(hand1[9].x - hand2[9].x) * 4.5;
                        const deltaHeight = Math.abs(hand1[9].y - hand2[9].y) * 4.5;
                        const deltaLength = Math.abs(hand1[9].z - hand2[9].z) * 12 + 0.3; // Depth telemetry estimation

                        // Apply independent dynamic scaling limitations safely
                        activeMesh.scale.x = THREE.MathUtils.lerp(activeMesh.scale.x, THREE.MathUtils.clamp(deltaWidth, 0.2, 5.0), 0.2);
                        activeMesh.scale.y = THREE.MathUtils.lerp(activeMesh.scale.y, THREE.MathUtils.clamp(deltaHeight, 0.2, 5.0), 0.2);
                        activeMesh.scale.z = THREE.MathUtils.lerp(activeMesh.scale.z, THREE.MathUtils.clamp(deltaLength, 0.2, 5.0), 0.2);
                    }
                } else {
                    // Reset pipeline parameters and return environment state back to OrbitControls
                    controls.enabled = true;
                    statusBadge.innerText = "No hand detected";
                    
                    // Smoothly reset back to uniform scale defaults when hands leave frame
                    activeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                }
            });

            const cameraDevice = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            cameraDevice.start();
        }

        function setupPanelDragging() {
            const panel = document.getElementById('control-panel');
            const handle = document.getElementById('panel-drag-handle');
            
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            handle.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = panel.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                
                startX = e.clientX;
                startY = e.clientY;

                panel.style.bottom = 'auto';
                panel.style.right = 'auto';
                panel.style.left = `${initialLeft}px`;
                panel.style.top = `${initialTop}px`;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                panel.style.left = `${initialLeft + dx}px`;
                panel.style.top = `${initialTop + dy}px`;
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initThreeJS();
        initTracking();
        animate();
    </script>
</body>
</html>
