<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Interface</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        :root {
            --neon-cyan: #00e5ff;
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(10, 10, 15, 0.4);
            --glass-border: rgba(0, 229, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            overflow: hidden;
            color: white;
            width: 100vw;
            height: 100vh;
        }

        /* Video and Canvases */
        #webcam, #mediapipe-canvas, #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view */
        }

        #mediapipe-canvas { z-index: 10; pointer-events: none; }
        #three-canvas { z-index: 20; pointer-events: none; }

        /* Glassmorphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
            border-radius: 12px;
        }

        /* Top Left Stats Card */
        #stats-card {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px 20px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 0 5px var(--neon-cyan);
            transition: opacity 0.3s ease;
        }

        #hand-count { font-size: 1.2rem; font-weight: bold; color: var(--neon-cyan); }
        #fps-counter { font-size: 0.9rem; opacity: 0.8; }

        /* Draggable Control Panel */
        #control-panel {
            position: absolute;
            top: 50%;
            left: 80%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.05);
        }

        .holo-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            width: 80%;
        }

        .holo-btn:hover, .holo-btn.active {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 10px rgba(0, 229, 255, 0.3);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neon-cyan);
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div id="loading">INITIALIZING SYSTEMS...</div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="mediapipe-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <div id="stats-card" class="glass">
        <div id="hand-count">0 HANDS DETECTED</div>
        <div id="fps-counter">FPS: 0</div>
    </div>

    <div id="control-panel" class="glass">
        <button class="holo-btn active" id="btn-cube">□ CUBE</button>
        <button class="holo-btn" id="btn-sphere">○ SPHERE</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js";

        // DOM Elements
        const video = document.getElementById('webcam');
        const mpCanvas = document.getElementById('mediapipe-canvas');
        const mpCtx = mpCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const handCountEl = document.getElementById('hand-count');
        const fpsEl = document.getElementById('fps-counter');
        const controlPanel = document.getElementById('control-panel');
        const loading = document.getElementById('loading');

        // State Variables
        let handLandmarker = null;
        let lastVideoTime = -1;
        let activeShape = 'cube';
        let isExploded = false;
        let isPanelDragged = false;
        let isObjectGrabbed = false;
        let panelOffset = { x: 0, y: 0 };
        
        let fpsStats = { frames: 0, lastTime: performance.now() };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Bloom Effect
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 1.2; // Neon glow strength
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3D Object Management (Particle based for explosion)
        let holoObject;
        let originalPositions, randomPositions;
        let animProgress = { value: 0 };

        function createObject(type) {
            if (holoObject) scene.remove(holoObject);

            let geometry;
            if (type === 'cube') {
                geometry = new THREE.BoxGeometry(3, 3, 3, 8, 8, 8);
            } else {
                geometry = new THREE.SphereGeometry(2, 24, 24);
            }

            const material = new THREE.PointsMaterial({
                color: 0x00e5ff,
                size: 0.08,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            holoObject = new THREE.Points(geometry, material);
            scene.add(holoObject);

            // Store positions for explosion physics
            const posAttr = geometry.attributes.position;
            originalPositions = new Float32Array(posAttr.array);
            randomPositions = new Float32Array(posAttr.array.length);

            for(let i=0; i<randomPositions.length; i+=3) {
                randomPositions[i] = originalPositions[i] + (Math.random() - 0.5) * 15;
                randomPositions[i+1] = originalPositions[i+1] + (Math.random() - 0.5) * 15;
                randomPositions[i+2] = originalPositions[i+2] + (Math.random() - 0.5) * 15;
            }
            isExploded = false;
            animProgress.value = 0;
        }

        createObject('cube');

        // UI Button Logic
        document.getElementById('btn-cube').addEventListener('click', () => {
            activeShape = 'cube';
            document.getElementById('btn-cube').classList.add('active');
            document.getElementById('btn-sphere').classList.remove('active');
            createObject('cube');
        });
        document.getElementById('btn-sphere').addEventListener('click', () => {
            activeShape = 'sphere';
            document.getElementById('btn-sphere').classList.add('active');
            document.getElementById('btn-cube').classList.remove('active');
            createObject('sphere');
        });

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            mpCanvas.width = window.innerWidth;
            mpCanvas.height = window.innerHeight;
        });

        // --- MEDIAPIPE SETUP ---
        async function initHandTracking() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            // Start Webcam
            navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    mpCanvas.width = window.innerWidth;
                    mpCanvas.height = window.innerHeight;
                    gsap.to(loading, { opacity: 0, duration: 1, onComplete: () => loading.style.display = 'none' });
                    renderLoop();
                });
            });
        }

        // --- GESTURE & INTERACTION LOGIC ---
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function isPinching(landmarks) {
            return getDistance(landmarks[4], landmarks[8]) < 0.05; // Thumb tip & Index tip
        }

        function isFist(landmarks) {
            // If index tip is closer to wrist than index MCP, it's curled.
            const indexCurled = getDistance(landmarks[8], landmarks[0]) < getDistance(landmarks[5], landmarks[0]);
            const middleCurled = getDistance(landmarks[12], landmarks[0]) < getDistance(landmarks[9], landmarks[0]);
            return indexCurled && middleCurled;
        }

        function handleGestures(results) {
            if (!results.landmarks || results.landmarks.length === 0) return;

            const hand1 = results.landmarks[0];
            const isHand1Pinching = isPinching(hand1);
            const isHand1Fist = isFist(hand1);
            
            // Normalize index tip to screen space (mirrored)
            const indexScreenX = (1 - hand1[8].x) * window.innerWidth;
            const indexScreenY = hand1[8].y * window.innerHeight;

            // 1. Control Panel Dragging Logic
            const panelRect = controlPanel.getBoundingClientRect();
            const overPanel = (indexScreenX >= panelRect.left && indexScreenX <= panelRect.right &&
                               indexScreenY >= panelRect.top && indexScreenY <= panelRect.bottom);

            if (isHand1Pinching && overPanel && !isPanelDragged && !isObjectGrabbed) {
                isPanelDragged = true;
                panelOffset.x = indexScreenX - panelRect.left - (panelRect.width/2);
                panelOffset.y = indexScreenY - panelRect.top - (panelRect.height/2);
            }

            if (isPanelDragged) {
                if (isHand1Pinching) {
                    gsap.to(controlPanel, {
                        left: indexScreenX - panelOffset.x,
                        top: indexScreenY - panelOffset.y,
                        duration: 0.1,
                        ease: "power2.out"
                    });
                } else {
                    isPanelDragged = false;
                }
            }

            // 2. 3D Object Grabbing & Movement (If not interacting with UI)
            if (isHand1Pinching && !isPanelDragged) {
                isObjectGrabbed = true;
                // Map normalized coords to 3D scene (Rough mapping)
                const targetX = ((1 - hand1[8].x) - 0.5) * 20; 
                const targetY = -(hand1[8].y - 0.5) * 15;
                
                gsap.to(holoObject.position, {
                    x: targetX,
                    y: targetY,
                    duration: 0.2,
                    ease: "power1.out"
                });
            } else {
                isObjectGrabbed = false;
            }

            // 3. Object Rotation (Map hand orientation)
            if (!isObjectGrabbed && !isExploded) {
                const pitch = (hand1[9].y - hand1[0].y) * Math.PI;
                const yaw = (hand1[9].x - hand1[0].x) * Math.PI;
                gsap.to(holoObject.rotation, {
                    x: pitch,
                    y: -yaw,
                    duration: 0.5
                });
            }

            // 4. Explosion / Reconstruction
            if (isHand1Fist && !isExploded) {
                isExploded = true;
                gsap.to(animProgress, {
                    value: 1, duration: 1.2, ease: "expo.out",
                    onUpdate: updateParticles
                });
            } else if (!isHand1Fist && isExploded) {
                isExploded = false;
                gsap.to(animProgress, {
                    value: 0, duration: 1.2, ease: "power3.inOut",
                    onUpdate: updateParticles
                });
            }

            // 5. Two Hands Scale
            if (results.landmarks.length > 1) {
                const hand2 = results.landmarks[1];
                const handsDist = getDistance(hand1[0], hand2[0]);
                // Map distance (0.1 to 0.6) to scale (0.5 to 3)
                let scale = THREE.MathUtils.clamp(handsDist * 5, 0.5, 3);
                gsap.to(holoObject.scale, { x: scale, y: scale, z: scale, duration: 0.2 });
            }
        }

        function updateParticles() {
            if(!holoObject) return;
            const positions = holoObject.geometry.attributes.position.array;
            for(let i = 0; i < positions.length; i++) {
                positions[i] = THREE.MathUtils.lerp(originalPositions[i], randomPositions[i], animProgress.value);
            }
            holoObject.geometry.attributes.position.needsUpdate = true;
        }

        // --- MAIN RENDER LOOP ---
        const drawingUtils = new DrawingUtils(mpCtx);

        function renderLoop() {
            // Calculate FPS
            const now = performance.now();
            fpsStats.frames++;
            if (now >= fpsStats.lastTime + 1000) {
                fpsEl.innerText = `FPS: ${fpsStats.frames}`;
                fpsStats.frames = 0;
                fpsStats.lastTime = now;
            }

            // MediaPipe Prediction
            let results = null;
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                results = handLandmarker.detectForVideo(video, now);
            }

            // Clear 2D Canvas
            mpCtx.clearRect(0, 0, mpCanvas.width, mpCanvas.height);

            if (results && results.landmarks) {
                // Update UI Hand count with fade
                const countText = results.landmarks.length === 1 ? "1 HAND DETECTED" : 
                                 (results.landmarks.length === 2 ? "2 HANDS DETECTED" : "0 HANDS DETECTED");
                
                if(handCountEl.innerText !== countText) {
                    gsap.fromTo(handCountEl, {opacity: 0}, {opacity: 1, duration: 0.3});
                    handCountEl.innerText = countText;
                }

                // Draw Cyan Holographic Skeleton
                for (const landmarks of results.landmarks) {
                    drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
                        color: "#00e5ff", lineWidth: 2
                    });
                    drawingUtils.drawLandmarks(landmarks, {
                        color: "white", fillColor: "#00e5ff", lineWidth: 1, radius: 3
                    });
                }

                handleGestures(results);
            }

            // Idle Rotation
            if (holoObject && !isObjectGrabbed && !isExploded && (!results || results.landmarks.length === 0)) {
                holoObject.rotation.x += 0.002;
                holoObject.rotation.y += 0.005;
            }

            // Render 3D Scene with Bloom
            composer.render();

            requestAnimationFrame(renderLoop);
        }

        // Initialize Everything
        initHandTracking();

    </script>
</body>
</html>
